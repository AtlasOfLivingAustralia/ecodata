apply plugin:"maven-publish"
publishing {
    repositories {
        maven {
            name 'Nexus'
            url "https://nexus.ala.org.au/content/repositories/${project.version.endsWith('-SNAPSHOT') ? 'snapshots' : 'releases'}"
            credentials {
                username = System.getenv('TRAVIS_DEPLOY_USERNAME')
                password = System.getenv('TRAVIS_DEPLOY_PASSWORD')
            }
        }
    }
    publications {
        mavenJar(MavenPublication) {
            // Only the executable bootJar is published; no software component is attached, so the
            // generated POM has no <dependencies> of its own.  The <dependencyManagement> section
            // holding the Grails / Spring Boot BOM imports is appended by Gradle after the
            // pom.withXml hook runs, so it cannot be stripped there (attempting to do so fails with
            // "replaceNode() can only be used to replace a single node, but was applied to 0 nodes").
            artifact bootJar
        }
    }
}