buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
        maven { url "https://repo.grails.org/grails/core" }
        maven { url "https://nexus.ala.org.au/content/groups/public/" }
        maven { url 'https://plugins.gradle.org/m2/' }
    }
    dependencies {
        // Grails 8: the Gradle plugin classpath uses the Grails Gradle BOM (Gradle 9 embeds Groovy 4).
        classpath platform("org.apache.grails:grails-gradle-bom:$grailsVersion")
        classpath "org.apache.grails:grails-gradle-plugins:$grailsVersion"
        classpath "cloud.wondrify:asset-pipeline-gradle:$assetPipelineVersion"
        classpath "cloud.wondrify:sass-asset-pipeline:$assetPipelineVersion"
    }
}

plugins {
    id "com.github.node-gradle.node" version "7.1.0"
    id 'jacoco'
    id "com.gorylenko.gradle-git-properties" version "2.5.2"
    id 'com.skillsjars.gradle-plugin' version '0.1.4'
}


version = "$ecodataVersion"
group = "au.org.ala"
description = "Ecodata"

// Declared before the Grails plugin is applied so the Grails BOM / CLI companions can be resolved.
repositories {
    mavenLocal()
    maven { url "https://repo.osgeo.org/repository/release/" }
    maven { url "https://repo.grails.org/grails/core" }
    maven { url "https://nexus.ala.org.au/content/groups/public/" }
    mavenCentral()
}

apply plugin:"eclipse"
apply plugin:"idea"
apply plugin:"war"
apply plugin: "groovy"
apply plugin:"org.apache.grails.gradle.grails-web"
apply plugin:"org.apache.grails.gradle.grails-gsp"
apply plugin: "org.apache.grails.gradle.grails-gson"
apply plugin:"cloud.wondrify.asset-pipeline"

if (Boolean.valueOf(enableJacoco)) {
    apply from: "${project.projectDir}/gradle/jacoco.gradle"
}

// Grails 8 requires JDK 21+; this application targets Java 25.
// (Gradle 9 removed the top-level sourceCompatibility/targetCompatibility convention properties.)
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

apply from: "${project.projectDir}/gradle/publish.gradle"

configurations {
    developmentOnly
    runtimeClasspath {
        extendsFrom developmentOnly
    }
}

dependencies {
    skill 'org.apache.grails.skills:grails-developer:8.0.0'
    skill 'org.apache.grails.skills:grails-8-upgrade:8.0.0'

    developmentOnly("org.springframework.boot:spring-boot-devtools")
    implementation "org.springframework.boot:spring-boot-starter-logging"
    implementation "org.springframework.boot:spring-boot-autoconfigure"
    implementation "org.apache.grails:grails-core"
    implementation 'javax.media:jai-core:1.1.3'
    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "org.springframework.boot:spring-boot-starter-tomcat"
    implementation "org.apache.grails:grails-web-boot"
    implementation "org.apache.grails:grails-logging"
    implementation "org.apache.grails:grails-rest-transforms"
    implementation "org.apache.grails:grails-databinding"
    implementation "org.apache.grails:grails-services"
    implementation "org.apache.grails:grails-url-mappings"
    implementation "org.apache.grails:grails-interceptors"
    implementation "org.apache.grails:grails-cache"
    implementation "org.ehcache:ehcache:3.10.8"
    implementation "org.apache.grails:grails-async"
    implementation "org.apache.grails:grails-scaffolding"
    implementation "org.apache.grails:grails-events"
    implementation "org.apache.grails:grails-datasource"
    implementation "org.apache.grails:grails-databinding"
    implementation "org.apache.grails:grails-codecs"
    implementation "org.apache.grails:grails-data-mongodb"
    implementation "org.apache.grails:grails-cache"
    implementation "org.commonmark:commonmark:0.24.0"
    implementation "org.apache.commons:commons-lang3:3.20.0"
    implementation "org.apache.commons:commons-text:1.15.0"

    //implementation 'com.graphql-java:graphql-java:21.5'
    implementation 'com.graphql-java:graphql-java-extended-scalars:24.0'
    implementation "org.apache.grails:grails-gsp"
    console "org.apache.grails:grails-console"
    profile "org.apache.grails.profiles:web"
    implementation "org.apache.grails:grails-views-gson"
    implementation "org.apache.grails:grails-data-mongodb-gson-templates"

    implementation 'org.grails.plugins:grails-mail:5.0.3'
    implementation "cloud.wondrify:asset-pipeline-grails:$assetPipelineVersion"

    implementation "org.elasticsearch:elasticsearch:$elasticsearchVersion"
    implementation "org.elasticsearch.client:elasticsearch-rest-high-level-client:$elasticsearchVersion"
    implementation "org.elasticsearch.client:elasticsearch-rest-client:$elasticsearchVersion"

    implementation "org.locationtech.spatial4j:spatial4j:0.8"

    implementation 'org.apache.poi:poi:5.4.1'
    implementation 'org.apache.poi:poi-ooxml:5.4.1'
    implementation 'org.apache.poi:poi-ooxml-full:5.4.1'
    implementation('org.apache.groovy:groovy-dateutil')

    implementation "org.grails.plugins:ala-auth:$alaSecurityLibsVersion"
    implementation "org.grails.plugins:ala-ws-security-plugin:$alaSecurityLibsVersion"
    implementation("org.grails.plugins:ala-ws-plugin:$alaSecurityLibsVersion") {
        // http-builder-helper 1.1.0 is a Grails 3 plugin whose descriptor registers rest.Application as a
        // provided artefact. Its static initialiser references grails.dev.Support (removed in Grails 7) and
        // overwrites the grails.main.class system property, which breaks startup once grails-quartz
        // (whose JobArtefactHandler initialises every provided artefact class) is on the classpath.
        exclude group: 'org.grails.plugins', module: 'http-builder-helper'
    }
    // Previously a transitive dependency of http-builder-helper; still required by ala-ws-plugin's WebService.
    implementation("org.codehaus.groovy.modules.http-builder:http-builder:0.7.1") {
        exclude group: 'org.codehaus.groovy'
    }
    implementation "au.org.ala:userdetails-service-client:$alaSecurityLibsVersion"

    implementation "au.org.ala.grails:interceptor-annotation-matcher:2.0.0-SNAPSHOT"

    implementation "org.codehaus.gpars:gpars:1.1.0"
    implementation 'org.apache.httpcomponents:httpclient:4.5.13'
    implementation "org.imgscalr:imgscalr-lib:4.2"
    implementation 'commons-io:commons-io:2.20.0'
    implementation ("com.github.fge:json-schema-validator:2.1.6")  {
        exclude module: "mailapi"
    }
    // Jackson 2 CSV module; version aligned through the jackson-2-bom managed by the Grails BOM.
    implementation "com.fasterxml.jackson.dataformat:jackson-dataformat-csv"

    implementation 'org.grails.plugins:excel-export:2.1'
    implementation "org.locationtech.jts:jts-core:${jtsVersion}"
    implementation 'com.itextpdf:itextpdf:5.5.13.3'
    implementation "org.apache.httpcomponents:httpmime:4.2.1"
    implementation "org.geotools.xsd:gt-xsd-kml:${geoToolsVersion}"
    implementation "org.geotools:gt-shapefile:${geoToolsVersion}"
    implementation "org.geotools:gt-geojson:${geoToolsVersion}"
    implementation "org.geotools:gt-epsg-hsql:${geoToolsVersion}"
    implementation 'com.twelvemonkeys.imageio:imageio-jpeg:3.12.0'
    implementation 'org.apache.grails:grails-mail'
    implementation 'com.drewnoakes:metadata-extractor:2.18.0'
    implementation 'com.googlecode.owasp-java-html-sanitizer:owasp-java-html-sanitizer:20260101.1'

    implementation 'org.apache.grails:grails-quartz'

    // For logback filter
    implementation 'org.codehaus.janino:janino:3.0.6'

    // Added due to previous reliance on transitive dependencies from plugins
    implementation 'au.com.bytecode:opencsv:2.4'
    implementation "cloud.wondrify:asset-pipeline-core:$assetPipelineVersion"
    implementation 'au.org.ala.plugins:openapi:2.0.0-SNAPSHOT'
    implementation "io.swagger.core.v3:swagger-annotations:2.2.23"
    implementation 'jakarta.ws.rs:jakarta.ws.rs-api:4.0.0'
    // Jakarta-based Hibernate Validator; version managed by Spring Boot 4 (6.2.x was javax-based).
    implementation "org.hibernate.validator:hibernate-validator"
    implementation 'org.springframework.boot:spring-boot-starter-graphql'
    implementation 'xyz.capybara:clamav-client:2.1.2'

    // aws sdk v2
    implementation "software.amazon.awssdk:s3:$awsSdkVersion"
    implementation "software.amazon.awssdk:apache-client:$awsSdkVersion"
    implementation "software.amazon.awssdk:sts:$awsSdkVersion"
    implementation "software.amazon.awssdk:sso:$awsSdkVersion"
    implementation "software.amazon.awssdk:ssooidc:$awsSdkVersion"

    testImplementation "org.apache.grails:grails-testing-support-datamapping"
    testImplementation "org.apache.grails:grails-geb"
    // grails-geb only exposes the Geb library (geb-spock, geb.* classes) via its test
    // fixtures in Grails 7; without this the integration tests fail to compile.
    testImplementation testFixtures("org.apache.grails:grails-geb")
    // Grails 8 moved grails.util.GrailsWebMockUtil into the grails-web-common test fixtures.
    testImplementation testFixtures("org.apache.grails.web:grails-web-common")
    testImplementation "org.apache.grails:grails-testing-support-web"
    testImplementation "org.apache.grails:grails-testing-support-views-gson"
    testImplementation "org.apache.grails.testing:grails-testing-support-mongodb"

    testImplementation 'com.github.tomakehurst:wiremock-jre8-standalone:2.35.1'
    testImplementation "org.seleniumhq.selenium:selenium-chrome-driver:$seleniumVersion"
    testRuntimeOnly "org.seleniumhq.selenium:selenium-firefox-driver:$seleniumVersion"
    testRuntimeOnly "org.seleniumhq.selenium:selenium-safari-driver:$seleniumSafariDriverVersion"
    testImplementation "org.seleniumhq.selenium:selenium-remote-driver:$seleniumVersion"
    testImplementation "org.seleniumhq.selenium:selenium-api:$seleniumVersion"
    testImplementation "org.seleniumhq.selenium:selenium-support:$seleniumVersion"
    testRuntimeOnly "org.seleniumhq.selenium:selenium-htmlunit-driver:2.47.1"
    //testRuntimeOnly "net.sourceforge.htmlunit:htmlunit:2.18"

    testImplementation "com.squareup.retrofit2:retrofit-mock:2.4.0"

    runtimeOnly "org.slf4j:jul-to-slf4j:1.7.7"
    runtimeOnly 'org.hsqldb:hsqldb:2.7.1'
    // TEMPORARY (Grails 8 migration): remove once startup reports no property-migration warnings.
    runtimeOnly 'org.springframework.boot:spring-boot-properties-migrator'
    // Gradle 9 no longer supplies an implicit JUnit Platform launcher.
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

springBoot {
    buildInfo()
}

bootRun {
    //dependsOn npm_run_bundle
    jvmArgs('-Dspring.output.ansi.enabled=always', '-Xmx8000m')
    sourceResources sourceSets.main
    System.properties.each { k,v->
        if(!systemProperties[k]) {
            systemProperties[k] = v
            println "$k = $v"
        }
    }
    String springProfilesActive = 'spring.profiles.active'
    systemProperty springProfilesActive, System.getProperty(springProfilesActive)
}


tasks.withType(GroovyCompile).configureEach {
    configure(groovyOptions) {
        forkOptions.jvmArgs = ['-Xmx1024m', '-Xss2048k']
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.withType(Test).configureEach {
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat 'full'
        showStandardStreams true
    }
}

assets {
    minifyJs = true
    minifyCss = true
}

npm_run_bundle {
    dependsOn npmInstall
}


bootJar {
    duplicatesStrategy(DuplicatesStrategy.EXCLUDE)
    enabled = true
    // launchScript() removed: Spring Boot 4 no longer supports fully executable jars.
}

assetCompile {
    dependsOn npm_run_bundle
}

assemble {
    dependsOn bootJar
}

bootWar {
    enabled = false
}

publish {
    dependsOn assemble
}

skillsjars {
    outputDir = layout.projectDirectory.dir('.agents/skills')
}


